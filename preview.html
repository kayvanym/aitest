<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily colour preview</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f3f5f8; --surface: #fff; --ink: #17212c; --muted: #586473; --line: #dbe1e8; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f141a; --surface: #182029; --ink: #e7ecf2; --muted: #9ba8b6; --line: #2b3643; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
.page { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 1.8rem; }
.fa { font-family: "Vazirmatn", Tahoma, sans-serif; }
.intro { margin: 0; color: var(--muted); }
.day { background: var(--surface); border: 1px solid var(--line); border-inline-start: 6px solid var(--accent); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.day .hero { position: relative; height: 120px; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, var(--a), var(--b)); }
.day canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.day .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.day .meta b { color: var(--accent); }
.day .meta span { color: var(--muted); }
.day .meta .today { font-size: .75rem; font-weight: 600; background: var(--accent); color: var(--surface); border-radius: 999px; padding: 2px 10px; }
a { color: inherit; }
</style>
</head>
<body>
<div class="page">
  <h1>Daily colour and image · <span class="fa" lang="fa">رنگ و تصویر هر روز</span></h1>
  <p class="intro">This preview shows the colour and banner image the digest will get on each of the next 7 days. The "Thought of the day" is written fresh by the agent each morning. <a href="index.html">Back to the digest</a></p>
  <div id="days"></div>
</div>
<script>
(function () {
  var hues = [215, 160, 280, 25, 340, 195, 95];
  var names = { 215: "blue", 160: "teal", 280: "violet", 25: "orange", 340: "rose", 195: "cyan", 95: "green" };
  var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var start = Date.UTC(2026, 10, 14);
  var box = document.getElementById("days");
  var canvases = [];
  for (var i = 0; i < 7; i++) {
    var t = start + i * 86400000, day = Math.floor(t / 86400000), h = hues[day % hues.length];
    var dt = new Date(t), iso = dt.toISOString().slice(0, 10);
    var wd = dt.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
    var el = document.createElement("div");
    el.className = "day";
    el.style.setProperty("--accent", dark ? "hsl(" + h + " 85% 74%)" : "hsl(" + h + " 65% 38%)");
    el.style.setProperty("--a", dark ? "hsl(" + h + " 55% 28%)" : "hsl(" + h + " 70% 42%)");
    el.style.setProperty("--b", dark ? "hsl(" + (h + 45) + " 55% 36%)" : "hsl(" + (h + 45) + " 70% 55%)");
    el.innerHTML = '<div class="hero"><canvas></canvas></div><div class="meta"><b>' + wd + '</b><span>' + names[h] + (i === 0 ? ' <span class="today">today</span>' : '') + '</span></div>';
    box.appendChild(el);
    canvases.push({ c: el.querySelector("canvas"), day: day });
  }
  function draw(item) {
    var seed = item.day * 2654435761 >>> 0;
    function rnd() { seed = (seed + 0x6D2B79F5) >>> 0; var x = seed; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }
    var c = item.c, r = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
    c.width = w * r; c.height = h * r;
    var g = c.getContext("2d"); g.scale(r, r);
    for (var i = 0; i < 16; i++) { g.beginPath(); g.arc(rnd() * w, rnd() * h, 10 + rnd() * 70, 0, Math.PI * 2); g.fillStyle = "rgba(255,255,255," + (0.04 + rnd() * 0.12) + ")"; g.fill(); }
    for (var k = 0; k < 7; k++) {
      var amp = 8 + rnd() * 28, freq = 0.004 + rnd() * 0.012, ph = rnd() * 6.3, y0 = h * (0.15 + rnd() * 0.7);
      g.beginPath();
      for (var x = 0; x <= w; x += 4) { var y = y0 + Math.sin(x * freq + ph) * amp + Math.sin(x * freq * 2.3 + ph) * amp * 0.3; if (x === 0) g.moveTo(x, y); else g.lineTo(x, y); }
      g.strokeStyle = "rgba(255,255,255," + (0.18 + rnd() * 0.3) + ")"; g.lineWidth = 1 + rnd() * 2; g.stroke();
    }
  }
  canvases.forEach(draw);
  var to; window.addEventListener("resize", function () { clearTimeout(to); to = setTimeout(function () { canvases.forEach(draw); }, 150); });
})();
</script>
</body>
</html>
