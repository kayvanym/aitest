<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News digests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,700&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#f3f5f8; --surface:#fff; --ink:#17212c; --muted:#586473; --line:#dbe1e8; --accent:#1d5bb8; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f141a; --surface:#182029; --ink:#e7ecf2; --muted:#9ba8b6; --line:#2b3643; --accent:#86b4ff; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "IBM Plex Sans","Segoe UI",Arial,sans-serif; }
.page { max-width:640px; margin:0 auto; padding:40px 20px 64px; display:flex; flex-direction:column; gap:28px; }
header { border-bottom:3px solid var(--ink); padding-bottom:16px; }
h1 { font-family:"Source Serif 4",Georgia,serif; font-size:clamp(2rem,6vw,2.6rem); line-height:1.15; margin:0; }
.fa { font-family:"Vazirmatn",Tahoma,sans-serif; }
.sub { color:var(--muted); margin:6px 0 0; }
.latest { display:flex; flex-direction:column; gap:6px; background:var(--surface); border:1px solid var(--line); border-inline-start:5px solid var(--accent); border-radius:8px; padding:18px 20px; text-decoration:none; color:var(--ink); }
.latest:hover, .latest:focus-visible { border-color:var(--accent); outline:none; }
.latest small { color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-size:.75rem; }
.latest strong { font-size:1.25rem; color:var(--accent); }
h2 { font-size:1.1rem; margin:0; }
ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
li a { display:flex; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 14px; color:var(--accent); text-decoration:none; font-variant-numeric:tabular-nums; }
li a span { color:var(--muted); }
footer { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>News digests <span class="fa" lang="fa">· خلاصهٔ اخبار</span></h1>
    <p class="sub">AI, information science and information systems · English and Farsi</p>
  </header>

  <!-- LATEST:START -->
  <a class="latest" href="digests/2026-11-14.html">
    <small>Newest</small>
    <strong>Saturday 14 November 2026</strong>
  </a>
  <!-- LATEST:END -->

  <section>
    <h2>All digests</h2>
    <ul>
      <!-- ARCHIVE:START -->
      <li><a href="digests/2026-11-14.html">2026-11-14 <span>Saturday</span></a></li>
      <!-- ARCHIVE:END -->
    </ul>
  </section>

  <footer>A new digest is added every morning.</footer>
</div>
</body>
</html>
